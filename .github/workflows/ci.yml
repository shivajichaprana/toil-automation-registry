name: Registry CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install validation tools
        run: python -m pip install -r requirements-dev.txt
      - name: Validate registry against its schema
        run: python tools/validate_registry.py --strict
      - name: Run regression tests
        run: python -m pytest
      - name: Check lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type-check tooling
        run: python -m mypy automation collectors ranking tools

  ci-complete:
    name: ci-complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: validate
    if: ${{ always() }}
    steps:
      - name: Require a successful validation matrix
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATION_RESULT" = success
